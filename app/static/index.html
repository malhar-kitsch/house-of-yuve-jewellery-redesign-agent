<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Yuve Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2a2620;--muted:#7a7164;--gold:#a8823c;--line:#e6dccb;--teal:#1f4b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
h1{font:600 40px/1.1 "Cormorant Garamond",serif;margin:0 0 4px}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:0 0 28px}
.top{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media(max-width:760px){.top{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--card);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;position:relative}
.drop.over{border-color:var(--gold)}
.drop img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{font-weight:500;display:block;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff;resize:vertical;min-height:70px}
.row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
select{border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#fff}
button{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:11px 26px;font:500 15px Inter;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.spend{margin-left:auto;font-size:13px;color:var(--muted)}
.spend.warn{color:#b3261e;font-weight:500}
.status{margin-top:14px;color:var(--muted);min-height:22px}
.status.err{color:#b3261e}
.piece{margin-top:28px;font-size:14px;color:var(--muted)}
.piece b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:4/5;background:#efe8da;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card .img img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.card .body{padding:14px 16px 16px}
.card h3{font:600 22px/1.2 "Cormorant Garamond",serif;margin:0 0 6px}
.card p{margin:0 0 8px;font-size:14px}
.card .reuse{color:var(--muted);font-size:13px}
.ex{display:flex;gap:6px;margin-top:10px}
.ex img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
input[type=number]{border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#fff;width:110px}
.gold{margin-top:8px;font-size:13px}
.gold div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tags span{font-size:12px;background:#f1e7d3;color:var(--ink);border-radius:999px;padding:2px 9px}
.fail{color:#b3261e;padding:16px;text-align:center;line-height:1.4}
.engine{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.keep{margin-top:12px;width:100%;background:none;color:var(--gold);border:1px solid var(--gold);padding:8px 14px;font-size:14px}
.keep.on{background:var(--gold);color:#fff}
.q{margin-top:16px}
.q > label{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#fff;color:var(--muted);border:1px solid var(--line);padding:6px 14px;font-size:14px}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.worth{margin-top:8px;font-size:14px}
.worth b{color:var(--gold)}
.cost{margin-top:10px;padding:10px 12px;background:#f6efe1;border-radius:10px;font-size:13px}
.cost .pay{font-size:15px;font-weight:500;margin-bottom:4px}
.cost div{display:flex;justify-content:space-between;gap:8px}
[hidden]{display:none!important}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.histbtn{background:none;color:var(--teal);border:1px solid var(--teal);padding:8px 18px;font-size:14px;flex-shrink:0}
.history{margin-bottom:28px}
.history h2{font:600 26px "Cormorant Garamond",serif;margin:0 0 12px}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.run{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit}
.run img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#efe8da}
.run div{padding:8px 10px;font-size:13px;line-height:1.35}
.run small{color:var(--muted)}
.inputs{font-size:13px;color:var(--muted);margin-top:6px}
.shimmer{background:linear-gradient(90deg,#efe8da 25%,#f7f1e4 50%,#efe8da 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<main>
  <div class="head"><div>
    <h1>Old gold, <span>new story</span></h1>
    <p class="sub">Upload a photo of an old piece. We'll suggest modern redesigns that reuse your gold — no melting.</p>
  </div><button class="histbtn" id="histBtn">History</button></div>
  <section class="history" id="history" hidden><h2>Past designs</h2><div class="runs" id="runs"></div></section>

  <div class="top">
    <div class="drop" id="drop"><div>Tap or drop a photo<br><small>JPG / PNG</small></div><input type="file" id="file" accept="image/*" hidden></div>
    <div class="panel">
      <label>Your gold</label>
      <div class="row" style="margin-top:0">
        <input type="number" id="grams" min="0" step="0.5" placeholder="Weight (g)" title="Gold weight in grams, if known">
        <select id="karat" title="Purity"><option value="24">24K</option><option value="22" selected>22K</option><option value="18">18K</option><option value="14">14K</option></select>
        <span class="hint" style="margin:0">24K today ₹</span><input type="number" id="rate" min="0" step="100" placeholder="per 10 g" title="Today's 24K gold rate per 10 g — fetched live, edit if your rate differs"><span class="hint" style="margin:0">per 10 g</span>
      </div>
      <div class="hint" id="rateSrc"></div>
      <div class="worth" id="weighed"></div>
      <div class="worth" id="worth"></div>

      <div class="q"><label>What would you like to do?</label>
        <div class="chips" id="goal" data-single>
          <button type="button" class="on" data-v="own">Redesign with my gold</button><button type="button" data-v="topup">Top up &amp; make it bigger</button><button type="button" data-v="idea">I have something in mind</button>
        </div>
        <div class="row" id="topupRow" hidden><span>Add up to ₹</span><input type="number" id="topup" min="0" step="10000" placeholder="e.g. 100000"><span class="hint" id="topupHint" style="margin:0"></span></div>
      </div>

      <div class="q"><label>Make it into <span style="color:var(--muted);font-weight:400">(pick any)</span></label>
        <div class="chips" id="pieces">
          <button type="button" data-v="necklace">Necklace</button><button type="button" data-v="choker">Choker</button><button type="button" data-v="long haar">Long haar</button><button type="button" data-v="earrings">Earrings</button><button type="button" data-v="bangles">Bangles</button><button type="button" data-v="bracelet">Bracelet</button><button type="button" data-v="ring">Ring</button><button type="button" data-v="pendant">Pendant</button><button type="button" data-v="maang tikka">Maang tikka</button>
        </div>
        <div class="chips" id="setSize" data-single style="margin-top:8px">
          <button type="button" class="on" data-v="any">Designer's choice</button><button type="button" data-v="single">One piece</button><button type="button" data-v="set">One matching set</button><button type="button" data-v="multi">Multiple pieces / sets</button>
        </div>
      </div>

      <div class="q"><label>Look &amp; occasion</label>
        <div class="chips" id="style" data-single>
          <button type="button" class="on" data-v="modern">Modern</button><button type="button" data-v="traditional">Traditional</button>
        </div>
        <div class="chips" id="occasion" data-single style="margin-top:8px">
          <button type="button" class="on" data-v="everyday">Everyday wear</button><button type="button" data-v="casual">Casual &amp; small events</button><button type="button" data-v="festive">Festive &amp; parties</button><button type="button" data-v="ceremonial">Ceremonial &amp; bridal</button>
        </div>
      </div>

      <div class="q"><label for="wish" id="wishLabel">Anything else? <span style="color:var(--muted);font-weight:400">(optional)</span></label>
      <textarea id="wish" placeholder="e.g. keep the peacock motif, add emeralds"></textarea></div>
      <div class="row">
        <select id="count"><option value="1">1 design</option><option value="2">2 designs</option><option value="4" selected>4 designs</option><option value="6">6 designs</option></select>
        <select id="engine" title="Image AI">
          <option value="gemini">Gemini · ~₹8</option>
          <option value="gpt">OpenAI · ~₹5</option>
          <option value="gpt-high">OpenAI high · ~₹16</option>
          <option value="flux">FLUX · ~₹6</option>
          <option value="compare">Compare all 3 · ~₹19</option>
        </select>
        <button id="go" disabled>Create designs</button>
        <span class="spend" id="spend"></span>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="piece" id="piece"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let file = null;
const PURITY = {24: 1, 22: 0.916, 18: 0.75, 14: 0.585};
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const range = ([a, b]) => a === b ? inr(a) : `${inr(a)} – ${inr(b)}`;
// Chip groups: data-single ones behave like radio buttons, the rest toggle freely.
document.querySelectorAll('.chips').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(g.hasAttribute('data-single')) g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  else b.classList.toggle('on');
  g.dispatchEvent(new Event('change'));
}));
const chosen = id => [...$(id).querySelectorAll('button.on')].map(b => b.dataset.v);
$('goal').addEventListener('change', () => {
  const g = chosen('goal')[0];
  $('topupRow').hidden = g !== 'topup';
  $('wishLabel').innerHTML = g === 'idea' ? 'Describe what you have in mind' : 'Anything else? <span style="color:var(--muted);font-weight:400">(optional)</span>';
  $('wish').placeholder = g === 'idea' ? 'e.g. a layered necklace with a big centre pendant and matching jhumkas' : 'e.g. keep the peacock motif, add emeralds';
});
// Weight read from the photo; cleared as soon as someone types the real weight.
let weighed = null;
const rate24 = () => +$('rate').value / 10;
function updateWorth(){
  const g = +$('grams').value, r = rate24() * PURITY[$('karat').value];
  const [lo, hi] = weighed ? [weighed.total_low, weighed.total_high] : [g * 0.95, g * 1.05];
  $('worth').innerHTML = g && r ? `Your gold is worth about <b>${inr(lo * r)} – ${inr(hi * r)}</b> at today's rate (${inr(r * 10)} per 10 g of ${$('karat').value}K).`
    : r ? '<span class="hint">Add a photo and we\'ll estimate the weight, or type it in if you know it.</span>' : '';
  const t = +$('topup').value;
  $('topupHint').textContent = t && r ? `≈ ${(t / r).toFixed(1)} g of extra gold, or richer stones` : '';
}
['grams', 'karat', 'rate', 'topup'].forEach(id => $(id).addEventListener('input', updateWorth));
$('grams').addEventListener('input', () => {
  if(!weighed) return;
  weighed = null; $('weighed').innerHTML = '<span class="hint">Using the weight you entered.</span>'; updateWorth();
});
$('karat').addEventListener('change', updateWorth);
fetch('/api/gold-rate').then(r => r.json()).then(d => {
  if(!d.rate || $('rate').value) return;
  $('rate').value = Math.round(d.rate * 10); $('rateSrc').textContent = `Live rate from ${d.source}. Change it if your rate differs.`; updateWorth();
}).catch(() => { $('rateSrc').textContent = "Couldn't fetch today's rate — type it in."; });

async function weigh(f){
  weighed = null; $('grams').value = ''; updateWorth();
  $('weighed').innerHTML = '<span class="hint">Reading your piece to estimate the gold weight…</span>';
  const fd = new FormData(); fd.append('photo', await shrink(f), 'photo.jpg');
  try{
    const r = await fetch('/api/weigh', {method:'POST', body:fd});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail);
    if(f !== file) return;  // a newer photo was picked meanwhile
    weighed = d; $('grams').value = d.best;
    $('weighed').innerHTML = `<b>From the photo:</b> ${d.pieces.map(p => `${esc(p.type)} (~${p.low}–${p.high} g)`).join(' + ')}. `
      + `Estimated total <b>~${d.best} g</b>. <span class="hint">Change it if you know the exact weight.</span>`;
    updateWorth();
  }catch(e){
    $('weighed').innerHTML = `<span class="hint">Couldn't estimate the weight (${esc(e.message || 'unknown error')}) — type it in, or we'll estimate while designing.</span>`;
  }
}

function pick(f){
  if(!f || !f.type.startsWith('image/')) return;
  file = f;
  const img = document.createElement('img'); img.src = URL.createObjectURL(f);
  $('drop').querySelector('img')?.remove(); $('drop').appendChild(img);
  $('go').disabled = false;
  weigh(f);
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
['dragover','dragenter'].forEach(t => $('drop').addEventListener(t, e => {e.preventDefault(); $('drop').classList.add('over')}));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => {e.preventDefault(); $('drop').classList.remove('over')}));
$('drop').addEventListener('drop', e => pick(e.dataTransfer.files[0]));

function showSpend(u){
  $('spend').textContent = `Spent ≈ Gemini $${u.gemini.toFixed(2)} · OpenRouter $${u.openrouter.toFixed(2)}`;
  $('spend').classList.toggle('warn', u.over.length > 0);
  if(u.over.length) $('spend').textContent += ` — over limit: ${u.over.join(', ')}`;
}
fetch('/api/usage').then(r => r.json()).then(showSpend).catch(()=>{});

$('go').onclick = async () => {
  const n = +$('count').value * ($('engine').value === 'compare' ? 3 : 1);
  $('go').disabled = true; $('status').className = 'status';
  $('status').textContent = 'Studying your piece and sketching ideas… (about 30–60 seconds)';
  $('piece').textContent = '';
  $('grid').innerHTML = Array(n).fill('<div class="card"><div class="img shimmer"></div><div class="body"><h3>&nbsp;</h3><p>&nbsp;</p></div></div>').join('');
  const fd = new FormData(); fd.append('photo', await shrink(file), 'photo.jpg'); fd.append('wish', $('wish').value); fd.append('count', $('count').value); fd.append('style', chosen('style')[0]); fd.append('engine', $('engine').value); fd.append('grams', $('grams').value || 0);
  fd.append('karat', $('karat').value); fd.append('rate24', rate24() || 0); fd.append('grams_estimated', !!weighed); fd.append('goal', chosen('goal')[0]);
  fd.append('topup', $('topup').value || 0); fd.append('pieces', chosen('pieces').join(',')); fd.append('set_size', chosen('setSize')[0]);
  fd.append('occasion', chosen('occasion')[0]);
  try{
    const r = await fetch('/api/redesign', {method:'POST', body:fd});
    const d = await r.json().catch(() => ({detail: `Server error (HTTP ${r.status}) with no details.`}));
    if(!r.ok) throw new Error(d.detail || 'Something went wrong');
    show(d);
    $('status').textContent = d.history_error || '';
    showSpend(d.usage);
    if(!$('history').hidden) loadHistory();
  }catch(e){
    $('grid').innerHTML = ''; $('status').className = 'status err'; $('status').textContent = e.message;
  }
  $('go').disabled = false;
};
const LABELS = {own: 'Redesign with my gold', topup: 'Top up', idea: 'Own idea', any: "designer's choice", single: 'one piece',
  set: 'one matching set', multi: 'multiple pieces', everyday: 'everyday', casual: 'casual & small events', festive: 'festive', ceremonial: 'ceremonial & bridal'};
function inputsText(i){
  if(!i) return '';
  return [i.grams ? `${i.grams} g${i.grams_estimated ? ' (from photo)' : ''} · ${i.karat}K` : `${i.karat}K`,
    LABELS[i.goal] + (i.goal === 'topup' && i.topup ? ` ${inr(i.topup)}` : ''),
    (i.pieces || []).join(', ') || null, LABELS[i.set_size], i.style, LABELS[i.occasion],
    i.rate24 ? `rate ${inr(i.rate24 * 10)}/10 g` : null, i.wish ? `“${i.wish}”` : null].filter(Boolean).join(' · ');
}
// Draws one run's results. Runs opened from history have no "keep" button (their working files may be gone).
function show(d, fromHistory){
    const est = d.estimate;
    $('piece').innerHTML = `<b>We see:</b> ${esc(d.piece.type)} — ${esc(d.piece.description)}${d.piece.gold_grams ? ` · <b>Gold:</b> ~${esc(d.piece.gold_grams)} g` : ''}`
      + (est ? `<div class="worth">Your ~${est.grams} g of ${est.karat}K gold is worth about <b>${range([est.low, est.high])}</b> (${inr(est.gram_rate * 10)} per 10 g${d.inputs?.grams_estimated || !d.inputs?.grams ? ' · weight estimated from the photo, so the range is wide' : ''}).</div>` : '')
      + (fromHistory ? `<div class="inputs"><b>Choices:</b> ${esc(inputsText(d.inputs))}</div>` : '');
    $('grid').innerHTML = d.designs.map((x, i) => `
      <div class="card">
        <div class="img">${x.image ? `<img src="${x.image_data || `/api/history/${d.run}/${x.saved_image}`}" alt="" onclick="openFull(this.src)">` : `<small class="fail">⚠ ${esc(x.error || 'No image came back and the AI gave no reason.')}</small>`}</div>
        <div class="body">
          <div class="engine">${esc(x.engine_name || '')}</div>
          <h3>${esc(x.title)}</h3>
          <p>${esc(x.idea)}</p>
          <div class="reuse">${esc(x.reuse || '')}</div>
          ${(x.gold_split || []).length ? `<div class="gold">${x.gold_split.map(g => `<div><span>${esc(g.piece)}</span><span>~${esc(g.grams)} g</span></div>`).join('')}</div>` : ''}
          ${x.cost ? `<div class="cost">
            <div class="pay"><span>${x.cost.pay[1] ? 'You pay about' : 'Extra to pay'}</span><span>${x.cost.pay[1] ? range(x.cost.pay) : 'nothing'}</span></div>
            ${x.cost.new_gold_grams ? `<div><span>New gold (${x.cost.new_gold_grams} g)</span><span>${inr(x.cost.new_gold)}</span></div>` : ''}
            <div><span>Stones &amp; additions</span><span>${range(x.cost.additions)}</span></div>
            <div><span>Making charges</span><span>${range(x.cost.making)}</span></div>
            <div style="color:var(--muted)"><span>Finished piece worth</span><span>${range(x.cost.piece_value)}</span></div>
          </div>` : ''}
          ${(x.added || []).length ? `<div class="tags">${x.added.map(a => `<span>+ ${esc(a)}</span>`).join('')}</div>` : ''}
          <div class="ex" title="Reference projects used">${x.examples.map(e => `<img src="/examples/${e}/after" alt="${e}">`).join('')}</div>
          ${x.image && !fromHistory ? `<button class="keep" data-run="${d.run}" data-i="${i + 1}">♡ Keep as example</button>` : ''}
        </div>
      </div>`).join('');
}

$('histBtn').onclick = () => {
  $('history').hidden = !$('history').hidden;
  if(!$('history').hidden) loadHistory();
};
async function loadHistory(){
  $('runs').innerHTML = '<span class="hint">Loading…</span>';
  try{
    const r = await fetch('/api/history'); const runs = await r.json();
    if(!r.ok) throw new Error(runs.detail);
    $('runs').innerHTML = runs.length ? runs.map(x => `
      <button class="run" data-run="${esc(x.run)}">
        <img src="/api/history/${esc(x.run)}/thumb.jpg" alt="" loading="lazy">
        <div>${esc(x.piece || 'Piece')}<br><small>${esc(when(x.run))} · ${x.designs} design${x.designs === 1 ? '' : 's'}${x.gold_value && x.gold_value[0] ? `<br>Gold ${range(x.gold_value)}` : ''}<br>${esc(LABELS[x.inputs?.goal] || '')}</small></div>
      </button>`).join('') : '<span class="hint">Nothing yet — designs you create will show up here.</span>';
  }catch(e){ $('runs').innerHTML = `<span class="hint">${esc(e.message || "Couldn't load history")}</span>`; }
}
$('runs').addEventListener('click', async e => {
  const b = e.target.closest('.run'); if(!b) return;
  $('status').className = 'status'; $('status').textContent = 'Opening…';
  try{
    const r = await fetch(`/api/history/${b.dataset.run}`); const d = await r.json();
    if(!r.ok) throw new Error(d.detail);
    show(d, true); $('status').textContent = `Showing a past run from ${when(d.run)}.`;
    $('piece').scrollIntoView({behavior: 'smooth'});
  }catch(err){ $('status').className = 'status err'; $('status').textContent = err.message || "Couldn't open that run"; }
});
// Run ids start with the UTC time they were made: 20261027-142501-ab12
function when(id){
  const m = /^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)/.exec(id); if(!m) return id;
  return new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5])).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
}
$('grid').addEventListener('click', async e => {
  const b = e.target.closest('.keep'); if(!b) return;
  const kept = !b.classList.contains('on');
  const fd = new FormData(); fd.append('run', b.dataset.run); fd.append('index', b.dataset.i); fd.append('kept', kept);
  b.disabled = true;
  try{
    const r = await fetch('/api/keep', {method:'POST', body:fd});
    if(!r.ok) throw 0;
    b.classList.toggle('on', kept);
    b.textContent = kept ? '♥ Kept — will guide future designs' : '♡ Keep as example';
  }catch{ b.textContent = 'Could not save — try again'; }
  b.disabled = false;
});
// Phone photos can be 10MB+; Vercel accepts ~4.5MB, so resize before upload.
function shrink(f, max = 1600){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || f), 'image/jpeg', 0.9);
    };
    img.onerror = () => res(f);
    img.src = URL.createObjectURL(f);
  });
}
function openFull(src){
  const w = window.open(); if(w) w.document.write(`<body style="margin:0;background:#111"><img src="${src}" style="max-width:100%;display:block;margin:auto">`);
}
function esc(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
